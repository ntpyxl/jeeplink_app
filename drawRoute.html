<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Route Node Editor</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="leafletMapStyles.css"/>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="flex flex-row">
        <div class="w-1/8">
            Dashboard
        </div>
        
        <div class="flex flex-col w-full">
            <div class="">
                <div id="map"></div>
            </div>
            <div>
                <p>Cursor Pos: <span id="cursor_pos_text"></span></p>
                <p>Cursor Last Clicked Pos: <span id="cursor_last_click_pos_text"></span></p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    
    <script src="graphBuilder.js" type="module"></script>
    <script src="app.js" type="module"></script>
</body>
</html>
