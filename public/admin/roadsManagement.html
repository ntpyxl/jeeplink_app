<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JeepLink - Admin Road Management</title>

    <!-- JeepLink Tab Logo -->
    <link rel="icon" type="image/png" href="../images/tab-logo.png">

    <!-- Tailwind Cdn (Install Tailwind) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font (Install if possible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

     <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/admin.css">

    <!-- Font Awesome (Install if possible) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="/styles/leafletMapStyles.css"/>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="flex">
        <!-- Overlay -->
        <div id="sidebarOverlay" 
            class="fixed inset-0 bg-black/50 z-[1000] hidden lg:hidden"
            onclick="closeSidebar()">
        </div>

        <!-- Sidebar -->
        <aside id="sidebar" class="w-92 h-screen overflow-y-auto fixed left-0 top-0 
                bg-gradient-to-b from-[#35903A] to-[#133A15] text-white
                z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0 z-[1100]">
            <div class="px-12">            
                <img src="../images/JeepLink-Logo.png" alt="JeepLink Logo" class="h-24 mx-auto bg-[#F0F0F0] rounded-2xl px-2 my-12">

                <hr class="text-[#90B67A]">
            </div>

        <!-- Main Navigation -->
            <nav class="mt-8 w-full flex flex-col text-xl items-center gap-4">

                <a href="dashboard.html" class="w-4/5 flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-[#2f7a33] transition">
                    <div class="w-8 h-8 flex items-center justify-center border-1 border-white rounded-full">
                        <i class="fas fa-chart-line text-white"></i>
                    </div>
                    Dashboard
                </a>

                <a href="routesManagement.html" class="w-4/5 flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-[#2f7a33] transition">
                    <div class="w-8 h-8 flex items-center justify-center border-1 border-white rounded-full">
                        <i class="fas fa-route text-white"></i>
                    </div>

                    Routes Management
                </a>

                <!-- ACTIVE -->
                <a href="roadsManagement.html" class="w-full flex items-center gap-3 py-3 px-14 bg-[#84C177] text-black font-semibold">
                    <div class="w-8 h-8 flex items-center justify-center border-1 border-black rounded-full">
                        <i class="fas fa-road text-black"></i>
                    </div>

                    Roads Management
                </a>

                <a href="reportsManagement.html" class="w-4/5 flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-[#2f7a33] transition">
                    <div class="w-8 h-8 flex items-center justify-center border-1 border-white rounded-full">
                        <i class="fas fa-chart-bar text-white"></i>
                    </div>
                    Reports Management
                </a>

                <a href="fareMatrixManagement.html" class="w-4/5 flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-[#2f7a33] transition">
                    <div class="w-8 h-8 flex items-center justify-center border-1 border-white rounded-full">
                        <i class="fas fa-money-bill text-white"></i>
                    </div>
                    <span class="nav-label text-lg">Fare Matrix Management</span>
                </a>
            </nav>

            <!-- Line -->
            <div class="px-12 my-12">            
                <hr class="text-[#90B67A]">
            </div>

            <!-- CRUD Navigation -->
            <nav class="mt-8 w-full flex flex-col text-xl items-center gap-4">

                <!-- NORMAL -->
                <a href="#" class="w-4/5 flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-[#2f7a33] transition">
                    <div class="w-8 h-8 flex items-center justify-center border-1 border-white rounded-full">
                        <i class="fas fa-exclamation text-white"></i>
                    </div>
                    Report Webpage
                </a>

                <a href="#" class="w-4/5 flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-[#2f7a33] transition">
                    <div class="w-8 h-8 flex items-center justify-center border-1 border-white rounded-full">
                        <i class="fas fa-book text-white"></i>
                    </div>
                    Guide Webpage
                </a>

                <a href="#" class="w-4/5 flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-[#2f7a33] transition">
                    <div class="w-8 h-8 flex items-center justify-center border-1 border-white rounded-full">
                        <i class="fas fa-question text-white"></i>
                    </div>
                    FAQs Webpage
                </a>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 lg:ml-92 p-4 lg:p-6">
            <!-- Header -->
            <header class="w-full top-0 z-50 bg-white flex items-center justify-between border-gray-300 border-b-1 px-6 py-12 ">

                <!-- Left Side -->
                <div class="flex items-center">
                    <button id="menuBtn" class="mr-4 flex items-center justify-center w-10 h-10 md:hidden">
                        <i class="fas fa-bars text-gray-600 text-xl"></i>
                    </button>
                    <h1 class="text-2xl md:text-4xl font-extralight text-gray-800">
                        Welcome back, Admin!
                    </h1>
                </div>

                <!-- Right Side -->
                <div class="flex items-center gap-6">

                    <!-- Notification Icon -->
                    <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-full shadow-sm hover:shadow-md transition">
                        <i class="fas fa-bell text-gray-600"></i>
                    </button>

                    <!-- Divider  -->
                    <div class="w-px h-12 bg-gray-300"></div>

                    <!-- Profile -->
                    <div class="flex items-center gap-3">
                        <!-- Use an existing image as avatar; falls back to a styled icon if not found -->
                        <img src="../images/hero1.jpg" alt="Admin avatar" onerror="this.style.display='none'" class="w-10 h-10 rounded-full object-cover border border-gray-200">
                        <span class="text-gray-700 font-medium">Admin</span>
                    </div>

                </div>
            </header>
            <div class="mt-6 flex flex-col w-full">
                <div class="">
                    <div id="map"></div>
                </div>
                <div>
                    Click on a road to disable it.
                    <button id="saveNewGeoJson" class="border-2 border-black px-3 py-1 hover:cursor-pointer">
                        Save new GeoJson Road Data
                    </button>
                </div>
            </div>
        
        </main>
    </div>

    <!-- Rotate Device Overlay -->
    <div id="rotateOverlay" 
        class="fixed inset-0 w-screen h-screen bg-black/90 text-white 
            flex flex-col items-center justify-center text-center 
            z-[9999] hidden">

        <div class="mb-4">
            <img src="../images/phone-rotate.png" 
                alt="rotate device" 
                class="w-16 h-16 animate-bounce">
        </div>

        <h2 class="text-xl sm:text-2xl font-bold mb-2">
            Rotate Your Device
        </h2>

        <p class="text-sm sm:text-base max-w-xs px-4">
            For a better experience, please rotate your device to landscape mode.
        </p>
    </div>

    <!-- JQuery CDN (Download) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Admin Front End Script -->
    <script src="../scripts/adminFrontEndScript.js"></script>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <script src="../scripts/jeeplinkApiFetcher.js" type="module"></script>
    <script src="../scripts/roadEditorScript.js" type="module"></script>
</body>
</html>
