<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeepLink - Admin</title>

    <!-- Tailwind Cdn (Install Tailwind) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font (Install if possible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

     <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/custom.css">

    <!-- Font Awesome (Install if possible) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="grid grid-cols-5 ">
        <!-- Left Side -->
        <div class="col-span-3 relative flex items-center justify-center h-screen overflow-hidden">
            <!-- Blurred Background Image -->
            <img src="/images/hero1.jpg"
                class="absolute w-full h-full object-cover blur-xs">

            <!-- Gradient Overlay -->
            <div class="absolute inset-0 bg-gradient-to-b from-[#1F3720]/60 to-[#519154]/60"></div>

            <!-- Logo -->
            <img src="../images/JeepLink-Logo2.png"
                class="relative h-24 md:h-80 bg-[#F0F0F0] rounded-full p-4"
                alt="JeepLink Logo">
        </div>

        <!-- Right Side -->
        <div class="col-span-2 flex items-center justify-center">
            <div class="text-[#2E7D32] w-full max-w-md px-12 py-16 bg-white rounded-3xl shadow-2xl flex flex-col gap-6">
                <div>
                    <h1 class="text-[#2E7D32] text-3xl font-bold mb-2">Admin Login</h1>
                    <h2 class="text-lg font-thin text-gray-600 ">
                        Enter your credentials to access the admin panel
                    </h2>
                </div>

                <form id="loginForm" class="flex flex-col gap-4">
                    <!-- Username -->
                    <div class="flex items-center border border-gray-300 rounded-2xl p-2 focus-within:ring-2 focus-within:ring-green-500">
                        <i class="fas fa-user mx-2 "></i>
                        <input type="text" id="usernameField" placeholder="Username" class="flex-1 outline-none p-2">
                    </div>

                    <!-- Password -->
                    <div class="flex items-center border border-gray-300 rounded-2xl p-2 focus-within:ring-2 focus-within:ring-green-500 relative">
                        <i class="fas fa-lock mx-2 "></i>
                        <input type="password" id="passwordField" placeholder="Password" class="flex-1 outline-none p-2">
                        <i id="togglePassword" class="fas fa-eye absolute right-3 cursor-pointer "></i>
                    </div>

                    <!-- Button -->
                    <button type="submit" class="w-full mt-4 self-center px-8 py-3 bg-gradient-to-r from-[#519154] to-[#D2E781] text-white rounded-xl hover:from-[#1B5E20] hover:to-[#0D47A1] focus:outline-none focus:ring-2 focus:ring-green-500 transition">
                        Login
                    </button>
                </form>

                <a href="/index.html" class="text-center text-gray-500 font-thin text-sm hover:underline"><i class="fas fa-arrow-left mr-2"></i> Back to Website</a>
                

                <p class="text-center text-gray-500 mt-8 font-extralight text-sm">© 2026 JeepLink. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="../scripts/jeeplinkApiFetcher.js" type="module"></script>
    <script src="../scripts/accountHandler.js" type="module"></script>
</body>
</html>
