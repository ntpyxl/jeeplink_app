<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeepLink - Road Management</title>

    <!-- Tailwind Cdn (Install Tailwind) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font (Install if possible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

     <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/custom.css">

    <!-- Font Awesome (Install if possible) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="/styles/leafletMapStyles.css"/>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="flex flex-row">
        <div class="w-1/8">
            Dashboard
        </div>
        
        <div class="flex flex-col w-full">
            <div class="">
                <div id="map"></div>
            </div>
            <div>
                Click on a road to disable it.
                <button id="saveNewGeoJson" class="border-2 border-black px-3 py-1 hover:cursor-pointer">
                    Save new GeoJson Road Data
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <script src="../scripts/jeeplinkApiFetcher.js" type="module"></script>
    <script src="../scripts/roadEditorScript.js" type="module"></script>
</body>
</html>
