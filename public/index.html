<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeepLink</title>

    <!-- Tailwind Cdn (Install Tailwind) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font (Install if possible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/custom.css">
    
    </head>
    <body>
        <!-- Start of Navigation Bar -->
        <nav>
            <div class="bg-white container mx-auto flex justify-between items-center px-2 py-3">
                <a href="index.html" class="flex items-center">
                    <img src="images/JeepLink-Logo.png" alt="JeepLink Logo" class="h-12 md:h-32">
                </a>

                <!-- Desktop links -->
                <div class="hidden md:flex text-xl flex-gap-12 gap-12 text-[#2E7D32]">
                    <a href="index.html" class="hover:text-black transition">Home</a>
                    <a href="report.html" class="hover:text-black transition">Report</a>
                    <a href="guide.html" class="hover:text-black transition">Guide</a>
                    <a href="faqs.html" class="hover:text-black transition">FAQs</a>
                </div>

                <!-- Mobile hamburger -->
                <button class="md:hidden p-2 rounded-lg" aria-label="Open menu">
                    <svg width="32" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="5" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="11" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="17" width="18" height="2" rx="1" fill="#0B5A2B"/>
                    </svg>
                </button>
            </div>
        </nav>
        <!-- End of Navigation Bar -->

        <!-- ── Hero Section ── -->
        <main class="hero-bg min-h-[88vh] min-h-scree flex items-center justify-center">
            <div class="flex flex-col items-center text-center gap-5 px-4 w-full max-w-6xl">
                <!-- Headline -->
                <h1 class="text-6xl text-white leading-tight mb-1">Welcome to JeepLink</h1>
                <p class="text-4xl text-white font-medium mb-6">
                    Find routes easily within <span style="color:#E9CD2D;">Dasmarinas City</span>!
                </p>

                <!-- Search Bar -->
                <div class="search-bar w-full bg-[#D9D9D9] border-[3px] border-[#004F11] flex items-center px-8 py-4 mt-4 shadow-xl rounded-3xl">     
                    <input
                        type="text"
                        placeholder="Starting Point"
                        class="flex-1 bg-transparent outline-none text-[#003B01] placeholder-[#2E7D32] font-medium ms-8 text-3xl italic"
                    />

                    <div class="flex items-center mx-6">
                        <svg width="45" height="22" viewBox="0 0 38 18" fill="none">
                            <path d="M2 9H36M36 9L28 2M36 9L28 16" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <input
                        type="text"
                        placeholder="Destination"
                        class="flex-1 bg-transparent outline-none text-[#003B01] placeholder-[#2E7D32] font-medium pe-4 text-3xl italic text-right"
                    />

                    <button class="ml-8 bg-[#004F11] hover:bg-[#1b5e20] transition rounded-full w-16 h-16 flex items-center justify-center">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none">
                            <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2.5"/>
                            <path d="M16.5 16.5L21 21" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>

                <!-- Recently Navigated -->
                <div class="flex flex-col items-start w-full max-w-6xl gap-2 mt-4">
                    <p class="text-white font-semibold text-2xl ms-8">Recently Navigated:</p>
                    <div class="flex flex-wrap gap-2 bg-[#FFF6C1] px-8 py-2 ms-16 opacity-80">
                        <span class="recent-tag px-3 py-1 flex items-center gap-2">
                            Emilio Aguinaldo College - Cavite
                            <button class="text-gray-500 hover:text-red-500 transition font-bold leading-none">×</button>
                        </span>
                    </div>
                </div>
            </div>
        </main>
        <!-- End of Hero Section -->
    </body>

</html>
