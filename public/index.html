<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeepLink</title>

    <!-- JeepLink Tab Logo -->
    <link rel="icon" type="image/png" href="images/tab-logo.png">

    <!-- leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="/styles/leafletMapStyles.css"/>

    <!-- Tailwind Cdn (Install Tailwind) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Google Font (Install if possible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=keyboard_arrow_down" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/custom.css">
    
    </head>
    <body>
        <!-- Start of Navigation Bar -->
        <nav class="bg-white shadow relative z-50">
            <div class="container mx-auto flex justify-between items-center px-4 py-3">

                <!-- Logo -->
                <a href="index.html" class="flex items-center">
                    <img src="images/JeepLink-Logo.png" 
                        alt="JeepLink Logo" 
                        class="h-24 sm:h-20 md:h-28 lg:h-32 transition-all">
                </a>

                <!-- Desktop links -->
                <div class="hidden md:flex text-lg lg:text-xl gap-16 text-[#2E7D32]">
                    <a href="index.html" class="hover:text-black transition">Home</a>
                    <a href="map.html" class="hover:text-black transition">Map</a>
                    <a href="report.html" class="hover:text-black transition">Report</a>
                    <a href="guide.html" class="hover:text-black transition">Guide</a>
                    <a href="faqs.html" class="hover:text-black transition">FAQs</a>
                </div>

                <!-- Hamburger Button -->
                <button id="menuBtn" class="md:hidden p-2 rounded-lg">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="5" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="11" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="17" width="18" height="2" rx="1" fill="#0B5A2B"/>
                    </svg>
                </button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu" 
                class="md:hidden absolute left-0 top-full w-full 
                        bg-white rounded-b-2xl shadow-lg overflow-hidden
                        max-h-0 transition-all duration-300 ease-in-out ">

                <div class="flex flex-col gap-3 text-[#2E7D32] text-lg py-4">
                    <a href="index.html" class="py-2 hover:text-black text-center bg-[#2E7D32] text-white transition">Home</a>
                    <a href="map.html" class="hover:text-black text-center transition">Map</a>
                    <a href="report.html" class="hover:text-black text-center transition">Report</a>
                    <a href="guide.html" class="hover:text-black text-center transition">Guide</a>
                    <a href="faqs.html" class="hover:text-black text-center transition">FAQs</a>
                </div>
            </div>
        </nav>
        <!-- End of Navigation Bar -->

        <!-- ── Hero Section ── -->
        <main class="hero-bg min-h-[88vh] flex items-center justify-center">
            <div class="flex flex-col items-center text-center gap-5 px-4 w-full max-w-6xl">

                <!-- Headline -->
                <h1 class="text-4xl md:text-6xl text-white leading-tight">
                    Welcome to Jeep<span class="text-[#E9CD2D]">Link</span>
                </h1>

                <p class="text-xl md:text-4xl text-white font-medium mb-6">
                    Find routes easily within 
                    <span class="text-[#E9CD2D]">Dasmarinas City</span>!
                </p>

                <!-- Search Bar -->
                <div class="w-full bg-[#D9D9D9] border-[3px] border-[#004F11] 
                            flex flex-col md:flex-row items-stretch md:items-center 
                            gap-3 md:gap-8 px-4 md:px-8 py-4 mt-4 shadow-xl rounded-3xl">

                    <!-- Starting Point -->
                    <div class="relative w-full">
                        <input
                            type="text"
                            id="startingPointField"
                            placeholder="Starting Point"
                            class="w-full bg-transparent outline-none 
                                text-[#003B01] placeholder-[#2E7D32] 
                                text-lg md:text-2xl italic"
                        />

                        <!-- Suggestions dropdown -->
                        <div id="startingSuggestions"
                            class="absolute left-0 top-full w-full mt-3 hidden z-50
                                bg-white/95 backdrop-blur-md
                                rounded-2xl shadow-2xl border border-gray-200
                                overflow-hidden animate-fadeIn">
                        </div>
                    </div>

                    <!-- Arrow (Desktop) + Divider Line (Mobile) -->
                    <div class="w-full md:w-auto flex items-center justify-center ">

                        <!-- Mobile Divider Line -->
                        <div class="block md:hidden my-4 w-full h-[2px] bg-[#2E7D32]"></div>

                        <!-- Desktop Arrow -->
                        <div class="hidden md:flex items-center mx-6">
                            <svg width="38" height="18" viewBox="0 0 38 18" fill="none">
                                <path d="M2 9H36M36 9L28 2M36 9L28 16"
                                    stroke="#2E7D32"
                                    stroke-width="2.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"/>
                            </svg>
                        </div>

                    </div>

                    <!-- Destination -->
                    <div class="relative w-full">
                        <input
                            type="text"
                            id="destinationPointField"
                            placeholder="Destination"
                            class="w-full bg-transparent outline-none 
                                text-[#003B01] placeholder-[#2E7D32] 
                                text-lg md:text-2xl italic"
                        />

                        <!-- Destination dropdown -->
                        <div id="destinationSuggestions"
                            class="absolute left-0 top-full w-full mt-3 hidden z-50
                                bg-white/95 backdrop-blur-md
                                rounded-2xl shadow-2xl border border-gray-200
                                overflow-hidden animate-fadeIn">
                        </div>
                    </div>

                    <!-- Button -->
                    <button id="calculateRouteButton"
                        class="w-12 h-12 md:w-16 md:h-16 
                            bg-[#004F11] hover:bg-[#1b5e20] 
                            transition transform hover:scale-105
                            rounded-full shadow-md
                            flex items-center justify-center 
                            flex-shrink-0 self-center">

                        <svg class="w-6 h-6 md:w-7 md:h-7" viewBox="0 0 24 24" fill="none">
                            <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2.5"/>
                            <path d="M16.5 16.5L21 21"
                                stroke="white"
                                stroke-width="2.5"
                                stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>

                <!-- Recently Navigated -->
                <div class="flex flex-col items-start w-full max-w-6xl gap-2 mt-4">
                    <p class="text-white font-semibold text-lg md:text-2xl mb-2">
                        Recently Navigated:
                    </p>

                    <div class="flex flex-wrap gap-2 bg-[#FFF6C1] px-4 md:px-8 py-2 opacity-80 md:w-auto">
                        <span class="recent-tag px-3 py-1 flex items-center gap-2 text-sm md:text-base">
                            Emilio Aguinaldo College - Cavite
                            <button class="text-gray-500 hover:text-red-500 transition font-bold leading-none">×</button>
                        </span>
                    </div>
                </div>

            </div>
        </main>
        <!-- End of Hero Section -->

        <!-- Search Suggestion Script -->
        <script src="scripts/homeSearchScript.js" type="module"></script>

        <!-- JQuery CDN (Download) -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- Commuter Front End Script -->
        <script src="scripts/commuterFrontEndScript.js"></script>

    </body>
</html>
