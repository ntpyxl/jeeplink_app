<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Road Editor</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="/styles/leafletMapStyles.css"/>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="flex flex-row">
        <div class="w-1/8">
            Dashboard
        </div>
        
        <div class="flex flex-col w-full">
            <div class="">
                <div id="map"></div>
            </div>
            <div>
                Click on a road to disable it.
                <button id="saveNewGeoJson" class="border-2 border-black px-3 py-1 hover:cursor-pointer">
                    Save new GeoJson Road Data
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    
    <script src="scripts/jeeplinkApiFetcher.js" type="module"></script>
    <script src="scripts/graphBuilder.js" type="module"></script>
    <script src="scripts/roadEditorScript.js" type="module"></script>
</body>
</html>
