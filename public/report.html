<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeepLink - Report</title>

    <!-- JeepLink Tab Logo -->
    <link rel="icon" type="image/png" href="images/tab-logo.png">

    <!-- Tailwind Cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/custom.css">

    <!-- JQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
</head>
<body>
    <!-- Start of Navigation Bar -->
    <nav class="bg-white shadow relative z-50">
        <div class="container mx-auto flex justify-between items-center px-4 py-3">

            <!-- Logo -->
            <a href="index.html" class="flex items-center">
                <img src="images/JeepLink-Logo.png" 
                    alt="JeepLink Logo" 
                    class="h-24 sm:h-20 md:h-28 lg:h-32 transition-all">
            </a>

            <!-- Desktop links -->
            <div class="hidden md:flex text-lg lg:text-xl gap-16 text-[#2E7D32]">
                <a href="index.html" class="hover:text-black transition">Home</a>
                <a href="map.html" class="hover:text-black transition">Map</a>
                <a href="report.html" class="hover:text-black transition">Report</a>
                <a href="guide.html" class="hover:text-black transition">Guide</a>
                <a href="faqs.html" class="hover:text-black transition">FAQs</a>
            </div>

            <!-- Hamburger Button -->
            <button id="menuBtn" class="md:hidden p-2 rounded-lg">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="5" width="18" height="2" rx="1" fill="#0B5A2B"/>
                    <rect x="3" y="11" width="18" height="2" rx="1" fill="#0B5A2B"/>
                    <rect x="3" y="17" width="18" height="2" rx="1" fill="#0B5A2B"/>
                </svg>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobileMenu" 
            class="md:hidden absolute left-0 top-full w-full 
                    bg-white rounded-b-2xl shadow-lg overflow-hidden
                    max-h-0 transition-all duration-300 ease-in-out">

            <div class="flex flex-col gap-3 text-[#2E7D32] text-lg py-4">
                <a href="index.html" class="hover:text-black text-center transition">Home</a>
                <a href="map.html" class="hover:text-black text-center transition">Map</a>
                <a href="report.html" class="py-2 bg-[#2E7D32] text-white hover:text-black text-center transition">Report</a>
                <a href="guide.html" class="hover:text-black text-center transition">Guide</a>
                <a href="faqs.html" class="hover:text-black text-center transition">FAQs</a>
            </div>
        </div>
    </nav>
    <!-- End of Navigation Bar -->

    <!-- Report Static Design -->
    <main class="min-h-screen flex flex-col">

        <!-- Banner -->
        <section class="report-hero-bg border-b-4 border-[#2D4B30]">
            <div class="container mx-auto px-4 py-12 md:py-16 text-center text-white">
                <h1 class="text-3xl sm:text-4xl md:text-6xl leading-tight">
                    Report an <span class="text-[#E9CD2D]">Issue</span>
                </h1>
                <p class="mt-4 text-lg sm:text-xl md:text-2xl tracking-wide">
                    Help us improve JeepLink by reporting any issues you encounter
                </p>
            </div>
        </section>

        <!-- Form area -->
        <section class="py-14 report-grid-bg flex-1">
            <div class="container mx-auto px-4">
                <div class="mx-auto w-full max-w-5xl">

                    <!-- Issue type pills -->
                    <div class="grid grid-cols-2 md:justify-between sm:grid-cols-2 md:flex md:flex-wrap gap-3 md:gap-6">
                        <button class="w-full md:w-auto px-4 md:px-16 py-2 rounded-md border-2 border-[#2E7D32] bg-[#5AA05F] text-[#E9CD2D] text-sm md:text-base">
                            Wrong Route
                        </button>
                        <button class="w-full md:w-auto px-4 md:px-16 py-2 rounded-md border-2 border-[#2E7D32] bg-white text-black text-sm md:text-base">
                            No Jeepney
                        </button>
                        <button class="w-full md:w-auto px-4 md:px-16 py-2 rounded-md border-2 border-[#2E7D32] bg-white text-black text-sm md:text-base">
                            Wrong Fare
                        </button>
                        <button class="w-full md:w-auto px-4 md:px-16 py-2 rounded-md border-2 border-[#2E7D32] bg-white text-black text-sm md:text-base">
                            Other Issues
                        </button>
                    </div>

                    <!-- Form -->
                    <div class="mt-8 md:mt-10">
                        <label class="block text-lg md:text-xl mb-2 md:mb-3">
                            Explain the Issue
                        </label>

                        <textarea
                            rows="6"
                            class="w-full rounded-md border-2 border-[#2E7D32] bg-white p-3 md:p-4 text-base md:text-lg outline-none"
                        ></textarea>

                        <!-- Inputs -->
                        <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-12">
                            <div>
                                <label class="block text-lg md:text-xl mb-2 md:mb-3">
                                    Your email (Optional):
                                </label>
                                <input
                                    type="email"
                                    class="w-full bg-white rounded-md border-2 border-[#2E7D32] px-4 py-2 text-base md:text-lg"
                                />
                            </div>

                            <div>
                                <label class="block text-lg md:text-xl mb-2 md:mb-3">
                                    Date:
                                </label>
                                <input
                                    type="text"
                                    class="w-full bg-white rounded-md border-2 border-[#2E7D32] px-4 py-2 text-base md:text-lg"
                                />
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="mt-10 flex justify-center">
                            <button
                                class="w-full sm:w-auto px-10 md:px-20 py-3 rounded-md border-2 border-[#2E7D32] bg-[#5AA05F] text-[#E9CD2D] text-lg md:text-xl"
                            >
                                Submit Report
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>
    <!-- End of Report -->

    <!-- Commuter Front End Script -->
    <script src="scripts/ui/commuterStylingScript.js"></script>

</body>
</html>
