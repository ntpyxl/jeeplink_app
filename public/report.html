<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeepLink</title>

    <!-- Tailwind Cdn (Install Tailwind) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font (Install if possible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/custom.css">
    
    </head>
    <body>
        <!-- Start of Navigation Bar -->
        <nav>
            <div class="bg-white container mx-auto flex justify-between items-center px-2 py-3">
                <a href="index.html" class="flex items-center">
                    <img src="images/JeepLink-Logo.png" alt="JeepLink Logo" class="h-12 md:h-32">
                </a>

                <!-- links -->
                <div class="hidden md:flex text-xl flex-gap-12 gap-12 text-[#2E7D32]">
                    <a href="index.html" class="hover:text-black transition">Home</a>
                    <a href="map.html" class="hover:text-black transition">Map</a>
                    <a href="report.html" class="hover:text-black transition">Report</a>
                    <a href="guide.html" class="hover:text-black transition">Guide</a>
                    <a href="faqs.html" class="hover:text-black transition">FAQs</a>
                </div>

                <!-- Mobile hamburger -->
                <button class="md:hidden p-2 rounded-lg" aria-label="Open menu">
                    <svg width="32" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="5" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="11" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="17" width="18" height="2" rx="1" fill="#0B5A2B"/>
                    </svg>
                </button>
            </div>
        </nav>
        <!-- End of Navigation Bar -->

        <!-- ── Report Static Design ── -->
        <main class="min-h-screen flex flex-col">
            <!-- Banner -->
            <section class="report-hero-bg border-b-4 border-[#2D4B30]">
                <div class="container mx-auto px-4 py-16 text-center text-white">
                    <h1 class="text-5xl md:text-6xl leading-tight">
                        Report an <span class="text-[#E9CD2D]">Issue</span>
                    </h1>
                    <p class="mt-5 text-lg md:text-xl tracking-wide">
                        Help us improve JeepLink by reporting any issues you encounter
                    </p>
                </div>
            </section>

            <!-- Form area -->
            <section
                class="py-14 report-grid-bg flex-1"
            >
                <div class="container mx-auto px-4">
                    <div class="mx-auto w-full max-w-5xl">
                        <!-- Issue type pills -->
                        <div class="flex flex-wrap justify-between gap-6 md:gap-10 ">
                            <button type="button" class="px-16 py-2.5 rounded-md border-2 border-[#2E7D32] bg-[#5AA05F] text-[#E9CD2D] shadow-sm">
                            Wrong Route
                            </button>
                            <button type="button" class="px-16 py-2.5 rounded-md border-2 border-[#2E7D32] bg-white text-black shadow-sm">
                                No Jeepney
                            </button>
                            <button type="button" class="px-16 py-2.5 rounded-md border-2 border-[#2E7D32] bg-white text-black shadow-sm">
                            Wrong Fare
                            </button>
                            <button type="button" class="px-16 py-2.5 rounded-md border-2 border-[#2E7D32] bg-white text-black shadow-sm">
                                Other Issues
                            </button>
                        </div>

                        <!-- Static form block -->
                        <div class="mt-10">
                            <label class="block text-xl mb-3">Explain the Issue</label>
                            <textarea
                                rows="7"
                                class="w-full rounded-md border-2 border-[#2E7D32] bg-white p-4 text-lg outline-none focus:ring-0"
                                placeholder=""
                            ></textarea>
                            <div class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-12">
                                <div>
                                    <label class="block text-xl mb-3">Your email (Optional):</label>
                                    <input
                                        type="email"
                                        class="w-full max-w-md rounded-md border-2 border-[#2E7D32] bg-white px-4 py-2.5 text-lg outline-none"
                                        placeholder=""/>
                                </div>
                                <div>
                                    <label class="block text-xl mb-3">Date:</label>
                                    <input
                                        type="text"
                                        class="w-full max-w-md rounded-md border-2 border-[#2E7D32] bg-white px-4 py-2.5 text-lg outline-none"
                                        placeholder=""/>
                                </div>
                            </div>
                            <div class="mt-12 flex justify-center">
                                <button
                                    type="button"
                                    class="px-24 py-3 rounded-md border-2 border-[#2E7D32] bg-[#5AA05F] text-[#E9CD2D] text-xl shadow-sm"
                                >
                                    Submit Report
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- End of Report -->

    </body>
</html>
