<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeepLink</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/custom.css">
    
    </head>
    <body>
        <!-- Start of Navigation Bar -->
        <nav>
            <div class="bg-white container mx-auto flex justify-between items-center px-2 py-3">
                <a href="index.html" class="flex items-center">
                    <img src="images/JeepLink-Logo.png" alt="JeepLink Logo" class="h-12 md:h-32">
                </a>

                <!-- links -->
                <div class="hidden md:flex text-xl flex-gap-12 gap-12 text-[#2E7D32]">
                    <a href="index.html" class="hover:text-black transition">Home</a>
                    <a href="report.html" class="hover:text-black transition">Report</a>
                    <a href="guide.html" class="hover:text-black transition">Guide</a>
                    <a href="faqs.html" class="hover:text-black transition">FAQs</a>
                </div>

                <!-- Mobile hamburger -->
                <button class="md:hidden p-2 rounded-lg" aria-label="Open menu">
                    <svg width="32" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="5" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="11" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="17" width="18" height="2" rx="1" fill="#0B5A2B"/>
                    </svg>
                </button>
            </div>
        </nav>
        <!-- End of Navigation Bar -->

        <!-- ── Guide Static Design ── -->
        <main class="min-h-screen flex flex-col">
            <!-- Top banner -->
            <section class="guide-hero-bg border-b-4 border-[#2D4B30]">
                <div class="container mx-auto px-4 py-16 text-center text-white">
                    <h1 class="text-5xl md:text-6xl leading-tight mb-4">
                        <span class="text-white">JeepLink</span>
                        <span class="text-[#E9CD2D]"> Guide</span>
                    </h1>
                    <p class="mt-2 text-lg md:text-xl tracking-wide">
                        A simple guide to navigating jeepney routes in Dasmariñas City
                    </p>
                </div>
            </section>

            <!-- Steps grid -->
            <section class="report-grid-bg flex-1 py-16">
                <div class="container mx-auto px-4">
                    <div class="grid gap-8 md:grid-cols-4">
                        <!-- Step 1 -->
                        <div class="flex flex-col items-center justify-center rounded-3xl border-[3px] border-[#004F11] bg-white shadow-sm py-12 px-6">
                            <div class="text-5xl md:text-6xl font-bold text-[#004F11] mb-4">1</div>
                            <p class="text-xl text-[#2E7D32] text-center leading-snug">
                                Enter your start<br>location
                            </p>
                        </div>

                        <!-- Step 2 -->
                        <div class="flex flex-col items-center justify-center rounded-3xl border-[3px] border-[#004F11] bg-white shadow-sm py-12 px-6">
                            <div class="text-5xl md:text-6xl font-bold text-[#004F11] mb-4">2</div>
                            <p class="text-xl text-[#2E7D32] text-center leading-snug">
                                Enter your<br>Destination
                            </p>
                        </div>

                        <!-- Step 3 -->
                        <div class="flex flex-col items-center justify-center rounded-3xl border-[3px] border-[#004F11] bg-white shadow-sm py-12 px-6">
                            <div class="text-5xl md:text-6xl font-bold text-[#004F11] mb-4">3</div>
                            <p class="text-xl text-[#2E7D32] text-center leading-snug">
                                View routes
                            </p>
                        </div>

                        <!-- Step 4 -->
                        <div class="flex flex-col items-center justify-center rounded-3xl border-[3px] border-[#004F11] bg-white shadow-sm py-12 px-6">
                            <div class="text-5xl md:text-6xl font-bold text-[#004F11] mb-4">4</div>
                            <p class="text-xl text-[#2E7D32] text-center leading-snug">
                                Follow routes
                            </p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- End of JeepLink Guide -->

    </body>
</html>
