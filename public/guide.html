<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeepLink - Guide</title>

    <!-- JeepLink Tab Logo -->
    <link rel="icon" type="image/png" href="images/tab-logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/custom.css">
    
    </head>
    <body>
        <!-- Start of Navigation Bar -->
        <nav class="bg-white shadow relative z-50">
            <div class="container mx-auto flex justify-between items-center px-4 py-3">

                <!-- Logo -->
                <a href="index.html" class="flex items-center">
                    <img src="images/JeepLink-Logo.png" 
                        alt="JeepLink Logo" 
                        class="h-24 sm:h-20 md:h-28 lg:h-32 transition-all">
                </a>

                <!-- Desktop links -->
                <div class="hidden md:flex text-lg lg:text-xl gap-16 text-[#2E7D32]">
                    <a href="index.html" class="hover:text-black transition">Home</a>
                    <a href="map.html" class="hover:text-black transition">Map</a>
                    <a href="report.html" class="hover:text-black transition">Report</a>
                    <a href="guide.html" class="hover:text-black transition">Guide</a>
                    <a href="faqs.html" class="hover:text-black transition">FAQs</a>
                </div>

                <!-- Hamburger Button -->
                <button id="menuBtn" class="md:hidden p-2 rounded-lg">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="5" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="11" width="18" height="2" rx="1" fill="#0B5A2B"/>
                        <rect x="3" y="17" width="18" height="2" rx="1" fill="#0B5A2B"/>
                    </svg>
                </button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu" 
                class="md:hidden absolute left-0 top-full w-full 
                        bg-white rounded-b-2xl shadow-lg overflow-hidden
                        max-h-0 transition-all duration-300 ease-in-out">

                <div class="flex flex-col gap-3 text-[#2E7D32] text-lg py-4">
                    <a href="index.html" class="hover:text-black text-center transition">Home</a>
                    <a href="map.html" class="hover:text-black text-center transition">Map</a>
                    <a href="report.html" class="hover:text-black text-center transition">Report</a>
                    <a href="guide.html" class="py-2 bg-[#2E7D32] text-white hover:text-black text-center transition">Guide</a>
                    <a href="faqs.html" class="hover:text-black text-center transition">FAQs</a>
                </div>
            </div>
        </nav>
        <!-- End of Navigation Bar -->

        <!-- Guide Static Design -->
        <main class="min-h-screen flex flex-col">

            <!-- Top banner -->
            <section class="guide-hero-bg border-b-4 border-[#2D4B30]">
                <div class="container mx-auto px-4 py-10 sm:py-14 md:py-16 text-center text-white">

                    <h1 class="text-3xl sm:text-4xl md:text-6xl leading-tight mb-3 md:mb-4">
                        <span>JeepLink</span>
                        <span class="text-[#E9CD2D]"> Guide</span>
                    </h1>

                    <p class="mt-4 text-lg sm:text-xl md:text-2xl tracking-wide">
                        A simple guide to navigating jeepney routes in Dasmariñas City
                    </p>
                </div>
            </section>

            <!-- Steps grid -->
            <section class="report-grid-bg flex-1 py-10 sm:py-14 md:py-16">
                <div class="container mx-auto px-4">

                    <!-- RESPONSIVE GRID -->
                    <div class="grid gap-6 sm:gap-8 
                                grid-cols-2 
                                lg:grid-cols-4">

                        <!-- Step 1 -->
                        <div class="flex flex-col items-center justify-center 
                                    rounded-2xl md:rounded-3xl 
                                    border-[2px] md:border-[3px] border-[#004F11] 
                                    bg-white shadow-sm 
                                    py-8 sm:py-10 md:py-12 px-4 sm:px-6">

                            <div class="text-6xl md:text-7xl font-bold text-[#004F11] mb-4">1</div>

                            <p class="text-base sm:text-lg md:text-xl text-[#2E7D32] text-center leading-snug">
                                Enter your start location
                            </p>
                        </div>

                        <!-- Step 2 -->
                        <div class="flex flex-col items-center justify-center 
                                    rounded-2xl md:rounded-3xl 
                                    border-[2px] md:border-[3px] border-[#004F11] 
                                    bg-white shadow-sm 
                                    py-8 sm:py-10 md:py-12 px-4 sm:px-6">

                            <div class="text-6xl md:text-7xl font-bold text-[#004F11] mb-4">2</div>

                            <p class="text-base sm:text-lg md:text-xl text-[#2E7D32] text-center leading-snug">
                                Enter your destination
                            </p>
                        </div>

                        <!-- Step 3 -->
                        <div class="flex flex-col items-center justify-center 
                                    rounded-2xl md:rounded-3xl 
                                    border-[2px] md:border-[3px] border-[#004F11] 
                                    bg-white shadow-sm 
                                    py-8 sm:py-10 md:py-12 px-4 sm:px-6">

                            <div class="text-6xl md:text-7xl font-bold text-[#004F11] mb-4">3</div>

                            <p class="text-base sm:text-lg md:text-xl text-[#2E7D32] text-center leading-snug">
                                View routes
                            </p>
                        </div>

                        <!-- Step 4 -->
                        <div class="flex flex-col items-center justify-center 
                                    rounded-2xl md:rounded-3xl 
                                    border-[2px] md:border-[3px] border-[#004F11] 
                                    bg-white shadow-sm 
                                    py-8 sm:py-10 md:py-12 px-4 sm:px-6">

                            <div class="text-6xl md:text-7xl font-bold text-[#004F11] mb-4">4</div>

                            <p class="text-base sm:text-lg md:text-xl text-[#2E7D32] text-center leading-snug">
                                Follow routes
                            </p>
                        </div>

                    </div>
                </div>
            </section>

        </main>

        <!-- JQuery CDN (Download) -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- Commuter Front End Script -->
        <script src="scripts/commuterFrontEndScript.js"></script>

    </body>
</html>
